# Services Up/Down Check
template:
  - sensor:
      - name: "Services All Up"
        unique_id: services_all_up
        state: >-
          {% set services = [
            'sensor.service_a_status',
            'sensor.service_b_status',
            'sensor.service_c_status',
            'sensor.service_d_status',
            'sensor.service_e_status',
            'sensor.service_f_status',
            'sensor.service_g_status',
            'sensor.service_h_status'
          ] %}
          {% set ns = namespace(any_down = false, any_unknown = false) %}
          {% for service in services %}
            {% if is_state(service, 'unknown') %}
              {% set ns.any_unknown = true %}
            {% elif not is_state(service, 'up') %}
              {% set ns.any_down = true %}
            {% endif %}
          {% endfor %}
          {% if ns.any_down %}down{% elif ns.any_unknown %}unknown{% else %}up{% endif %}
